.btn{border:none;border-radius:50%;background:#222;color:#fff;width:52px;height:52px;font-size:20px;margin:0 8px}
.btnP{width:70px;height:70px;background:#fff;color:#000;font-size:28px}
.list{max-width:420px;margin:18px auto;background:#0e0e0e;border-radius:12px;text-align:left;max-height:50vh;overflow:auto}
.song{padding:10px 12px;border-top:1px solid #1a1a1a;display:flex;justify-content:space-between}
.song.active{background:#1e1e1e}

var idx=0, playing=false;
var aud=document.getElementById('aud');
function fmt(s){ if(!isFinite(s)) return "0:00"; var m=Math.floor(s/60), sec=Math.floor(s%60); return m+":"+(sec<10?"0":"")+sec; }
function render(){
  var list=document.getElementById('list');
  var html='<div style="padding:10px;color:#666;font-size:10px">📁 '+tracks.length+' titres - '+ (idx+1) +'/'+ tracks.length +'</div>';
  for(var i=0;i<tracks.length;i++){
    var t=tracks[i];
    var active = i===idx ? ' active' : '';
    html+='<div class="song'+active+'" onclick="loadTrack('+i+')"><div><b style="font-size:12px;display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t.title+'</b><span style="font-size:10px;color:#555">'+t.file+'</span></div><span style="color:#4ade80">'+(i===idx && playing ? '▶':'')+'</span></div>';
  }
  list.innerHTML=html;
}
function loadTrack(i){
  idx=i;
  document.getElementById('tit').textContent=tracks[idx].title;
  document.getElementById('sub').textContent=tracks[idx].file;
  aud.src=encodeURI(tracks[idx].url);
  aud.load();
  aud.play().then(function(){ playing=true; updateBtn(); }).catch(function(e){ document.getElementById('sub').textContent='Erreur: '+e.message; });
  render();
}
function toggle(){ if(aud.paused) aud.play(); else aud.pause(); }
function next(){ loadTrack((idx+1)%tracks.length); }
function prev(){ loadTrack((idx-1+tracks.length)%tracks.length); }
function updateBtn(){ document.getElementById('playBtn').textContent = aud.paused ? '▶' : '⏸'; }
aud.addEventListener('play', function(){ playing=true; updateBtn(); render(); });
aud.addEventListener('pause', function(){ playing=false; updateBtn(); render(); });
aud.addEventListener('ended', next);
aud.addEventListener('timeupdate', function(){
  if(!aud.duration) return;
  var pct=(aud.currentTime/aud.duration)*100;
  document.getElementById('fill').style.width=pct+'%';
  document.getElementById('cur').textContent=fmt(aud.currentTime);
  document.getElementById('rem').textContent='-'+fmt(aud.duration-aud.currentTime);
});
document.getElementById('bar').onclick=function(e){
  var r=this.getBoundingClientRect();
  var pct=(e.clientX-r.left)/r.width;
  if(aud.duration) aud.currentTime=pct*aud.duration;
};
render();
loadTrack(0);
